<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Title</title>
    <link rel="stylesheet" href="style.css">
    <script src="../dist/index.js" defer></script>
</head>

<body>
    <div class="image-wrapper">
        <img id="mw-image" src="images/player/Claymore_Ice1.png"/>
    </div>

    <div class="buttons-wrapper">
        <button class="fast-backward" id="mw-fast-backward">
            <img src="images/ui/fast-backward.png"/>
        </button>
        <button class="back" id="mw-back">
            <img src="images/ui/back.png"/>
        </button>
        <button class="play" id="mw-play">
            <img id="mw-play-img" src="images/ui/play.png"/>
        </button>
        <button class="next" id="mw-next">
            <img src="images/ui/next.png"/>
        </button>
        <button class="fast-forward" id="mw-fast-forward">
            <img src="images/ui/fast-forward.png"/>
        </button>
    </div>

</body>

</html>
